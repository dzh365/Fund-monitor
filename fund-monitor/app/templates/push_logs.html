{% extends "base.html" %}
{% block title %}推送日志 - 基金监控{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-bell-fill"></i> 推送日志</h1>
    <button class="btn btn-accent" onclick="triggerPush()">
        <i class="bi bi-send-fill"></i> 手动推送
    </button>
</div>

<div class="card-dark">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark-custom mb-0">
                <thead>
                    <tr>
                        <th style="width:180px">推送时间</th>
                        <th style="width:80px">状态</th>
                        <th>推送内容</th>
                        <th>错误信息</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <tr><td colspan="4" class="text-center text-muted py-4">加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 分页 -->
<div class="d-flex justify-content-between align-items-center mt-3">
    <span class="text-muted small" id="log-info"></span>
    <div id="log-pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
setActiveNav('/push-logs');

let currentPage = 1;
const pageSize = 20;

document.addEventListener('DOMContentLoaded', () => loadLogs());

async function loadLogs(page = 1) {
    currentPage = page;
    try {
        const data = await api(`/api/push/logs?page=${page}&size=${pageSize}`);
        const tbody = document.getElementById('log-table-body');

        if (!data.items.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">暂无推送记录</td></tr>';
            document.getElementById('log-info').textContent = '';
            document.getElementById('log-pagination').innerHTML = '';
            return;
        }

        tbody.innerHTML = data.items.map(log => `
            <tr>
                <td class="text-nowrap">${log.push_time}</td>
                <td>
                    ${log.status === 'success'
                        ? '<span class="badge bg-success">成功</span>'
                        : '<span class="badge bg-danger">失败</span>'}
                </td>
                <td class="text-truncate" style="max-width:400px" title="${log.content}">${log.content || '-'}</td>
                <td class="text-danger small">${log.error_msg || '-'}</td>
            </tr>
        `).join('');

        const totalPages = Math.ceil(data.total / pageSize);
        document.getElementById('log-info').textContent = `共 ${data.total} 条记录`;

        let paginationHtml = '';
        if (totalPages > 1) {
            paginationHtml = '<nav><ul class="pagination pagination-sm mb-0">';
            for (let i = 1; i <= totalPages; i++) {
                paginationHtml += `
                    <li class="page-item ${i === page ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadLogs(${i});return false">${i}</a>
                    </li>`;
            }
            paginationHtml += '</ul></nav>';
        }
        document.getElementById('log-pagination').innerHTML = paginationHtml;

    } catch (e) {
        console.error(e);
    }
}

async function triggerPush() {
    if (!confirm('确认手动触发一次推送？')) return;
    try {
        const result = await api('/api/push/trigger', { method: 'POST' });
        if (result.success) {
            showToast('推送成功！', 'success');
        } else {
            showToast('推送失败: ' + (result.message || '未知错误'), 'error');
        }
        loadLogs();
    } catch (e) { /* handled */ }
}
</script>
{% endblock %}
