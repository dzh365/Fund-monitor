<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}基金监控{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- 主题尽早初始化，防止闪烁 -->
    <script src="/static/js/app.js"></script>
    {% block head %}{% endblock %}
</head>
<body>

<!-- 侧边栏 -->
<nav class="sidebar">
    <div class="sidebar-brand">
        <span>📈</span> 基金监控系统
    </div>
    <div class="sidebar-nav">
        <a href="/" data-page="dashboard">
            <span class="icon"><i class="bi bi-grid-1x2-fill"></i></span> 总览面板
        </a>
        <a href="/accounts" data-page="accounts">
            <span class="icon"><i class="bi bi-wallet2"></i></span> 资金账户
        </a>
        <a href="/push-logs" data-page="push">
            <span class="icon"><i class="bi bi-bell-fill"></i></span> 推送日志
        </a>
        <a href="/settings" data-page="settings">
            <span class="icon"><i class="bi bi-gear-fill"></i></span> 系统设置
        </a>
    </div>

    <!-- 主题切换 -->
    <div class="sidebar-footer">
        <div class="theme-switcher">
            <button class="theme-btn" data-theme="light" onclick="ThemeManager.apply('light');ThemeManager._updateCharts()" title="浅色模式">
                <span class="icon"><i class="bi bi-sun-fill"></i></span> 浅色
            </button>
            <button class="theme-btn" data-theme="dark" onclick="ThemeManager.apply('dark');ThemeManager._updateCharts()" title="深色模式">
                <span class="icon"><i class="bi bi-moon-stars-fill"></i></span> 深色
            </button>
            <button class="theme-btn" data-theme="system" onclick="ThemeManager.apply('system');ThemeManager._updateCharts()" title="跟随系统">
                <span class="icon"><i class="bi bi-display"></i></span> 系统
            </button>
        </div>
    </div>
</nav>

<!-- 移动端主题切换按钮 -->
<div class="theme-switcher-mobile">
    <button class="btn btn-outline-accent btn-sm rounded-pill" onclick="ThemeManager.cycle()" title="切换主题">
        <i class="bi bi-palette-fill"></i>
    </button>
</div>

<!-- 主内容 -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<!-- Toast 容器 -->
<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
