services:
  fund-monitor:
    build: .
    container_name: fund-monitor
    restart: unless-stopped
    ports:
      - "16888:16888"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=16888
      - DATABASE_URL=sqlite:///./data/fund_monitor.db
      - SERVERCHAN_SENDKEY=${SERVERCHAN_SENDKEY:-}
      - PUSH_TIME=${PUSH_TIME:-20:00}
      - SKIP_WEEKEND=${SKIP_WEEKEND:-true}
