{% extends "base.html" %}
{% block title %}总览面板 - 基金监控{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-grid-1x2-fill"></i> 总览面板</h1>
    <span class="text-secondary" id="today-date"></span>
</div>

<!-- 顶部数据卡片 -->
<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="stat-card h-100">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="label">总资产（市值）</div>
                    <div class="value" id="total-value">--</div>
                </div>
                <div class="icon-box" style="background:rgba(59,130,246,.15);color:var(--accent)">
                    <i class="bi bi-bank2"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card h-100">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="label">总盈亏</div>
                    <div class="value" id="total-profit">--</div>
                    <div class="sub" id="total-profit-pct"></div>
                </div>
                <div class="icon-box" id="profit-icon" style="background:var(--profit-bg);color:var(--profit)">
                    <i class="bi bi-graph-up-arrow"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card h-100">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="label">持有基金数</div>
                    <div class="value" id="total-funds">--</div>
                </div>
                <div class="icon-box" style="background:rgba(245,158,11,.15);color:var(--warning)">
                    <i class="bi bi-collection-fill"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card h-100">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="label">资金账户数</div>
                    <div class="value" id="total-accounts">--</div>
                </div>
                <div class="icon-box" style="background:rgba(139,92,246,.15);color:#8b5cf6">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 图表区域 -->
<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card-dark">
            <div class="card-header">账户持仓占比</div>
            <div class="card-body" style="padding:.5rem">
                <div id="chart-pie" style="height:280px"></div>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card-dark">
            <div class="card-header">各账户盈亏对比</div>
            <div class="card-body" style="padding:.5rem">
                <div id="chart-bar" style="height:280px"></div>
            </div>
        </div>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-12">
        <div class="card-dark">
            <div class="card-header">总资产趋势（近30天）</div>
            <div class="card-body" style="padding:.5rem">
                <div id="chart-trend" style="height:260px"></div>
            </div>
        </div>
    </div>
</div>

<!-- 账户概览表格 -->
<div class="card-dark">
    <div class="card-header">账户概览</div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark-custom mb-0">
                <thead>
                    <tr>
                        <th>账户名称</th>
                        <th>基金数</th>
                        <th class="text-end">持仓市值</th>
                        <th class="text-end">总成本</th>
                        <th class="text-end">盈亏金额</th>
                        <th class="text-end">收益率</th>
                    </tr>
                </thead>
                <tbody id="account-table-body">
                    <tr><td colspan="6" class="text-center text-muted py-4">加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
setActiveNav('/');

// 日期
document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});

// 从 CSS 变量读取当前主题色
function getThemeColor(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}
function echartsTheme() {
    return {
        backgroundColor: 'transparent',
        textStyle: { color: getThemeColor('--text-muted') || '#94a3b8' },
    };
}

// ── 加载数据 ──────────────────────────────
async function loadDashboard() {
    try {
        const [stats, accountStats, trend] = await Promise.all([
            api('/api/dashboard/stats'),
            api('/api/dashboard/account-stats'),
            api('/api/dashboard/trend?days=30'),
        ]);

        // 卡片数据
        document.getElementById('total-value').textContent = formatMoney(stats.global_market_value, false);
        const profitEl = document.getElementById('total-profit');
        profitEl.textContent = formatMoney(stats.global_profit);
        profitEl.className = 'value ' + profitClass(stats.global_profit);
        document.getElementById('total-profit-pct').textContent = formatPct(stats.global_profit_pct);
        document.getElementById('total-profit-pct').className = 'sub ' + profitClass(stats.global_profit_pct);
        document.getElementById('total-funds').textContent = stats.total_funds;
        document.getElementById('total-accounts').textContent = stats.total_accounts;

        // 图标颜色
        const iconBox = document.getElementById('profit-icon');
        if (stats.global_profit >= 0) {
            iconBox.style.background = 'var(--profit-bg)';
            iconBox.style.color = 'var(--profit)';
        } else {
            iconBox.style.background = 'var(--loss-bg)';
            iconBox.style.color = 'var(--loss)';
        }

        // 饼图
        renderPie(accountStats);
        // 柱状图
        renderBar(accountStats);
        // 趋势图
        renderTrend(trend);
        // 表格
        renderTable(accountStats);

    } catch (e) {
        console.error(e);
    }
}

// ── 饼图 ──────────────────────────────────
function renderPie(accounts) {
    const chart = echarts.init(document.getElementById('chart-pie'));
    const data = accounts.map(a => ({
        name: a.account_name,
        value: a.total_market_value,
    }));
    chart.setOption({
        ...echartsTheme(),
        tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
        legend: { bottom: 0, textStyle: { color: getThemeColor('--text-muted') } },
        series: [{
            type: 'pie', radius: ['40%', '70%'],
            label: { show: false },
            emphasis: { label: { show: true, fontSize: 14 } },
            data,
        }],
    });
    window.addEventListener('resize', () => chart.resize());
}

// ── 柱状图 ──────────────────────────────────
function renderBar(accounts) {
    const chart = echarts.init(document.getElementById('chart-bar'));
    const names = accounts.map(a => a.account_name);
    const profits = accounts.map(a => a.total_profit);
    const profitColor = getThemeColor('--profit') || '#ef4444';
    const lossColor = getThemeColor('--loss') || '#22c55e';
    const colors = profits.map(p => p >= 0 ? profitColor : lossColor);
    chart.setOption({
        ...echartsTheme(),
        tooltip: { trigger: 'axis' },
        grid: { left: 60, right: 20, top: 20, bottom: 40 },
        xAxis: { type: 'category', data: names, axisLine: { lineStyle: { color: getThemeColor('--border') } } },
        yAxis: {
            type: 'value',
            axisLine: { lineStyle: { color: getThemeColor('--border') } },
            splitLine: { lineStyle: { color: getThemeColor('--border') } },
        },
        series: [{
            type: 'bar', barWidth: '50%',
            data: profits.map((p, i) => ({
                value: p,
                itemStyle: { color: colors[i], borderRadius: [4, 4, 0, 0] },
            })),
        }],
    });
    window.addEventListener('resize', () => chart.resize());
}

// ── 趋势图 ──────────────────────────────────
function renderTrend(trend) {
    const chart = echarts.init(document.getElementById('chart-trend'));
    const accent = getThemeColor('--accent') || '#3b82f6';
    chart.setOption({
        ...echartsTheme(),
        tooltip: { trigger: 'axis', formatter: p => `${p[0].axisValue}<br/>市值: ¥${p[0].value.toLocaleString()}` },
        grid: { left: 80, right: 20, top: 20, bottom: 40 },
        xAxis: {
            type: 'category', data: trend.dates,
            axisLine: { lineStyle: { color: getThemeColor('--border') } },
        },
        yAxis: {
            type: 'value',
            axisLine: { lineStyle: { color: getThemeColor('--border') } },
            splitLine: { lineStyle: { color: getThemeColor('--border') } },
            axisLabel: { formatter: v => (v / 10000).toFixed(1) + '万' },
        },
        series: [{
            type: 'line', smooth: true, symbol: 'none',
            lineStyle: { color: accent, width: 2 },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: accent.replace(')', ',.3)').replace('rgb', 'rgba') },
                    { offset: 1, color: accent.replace(')', ',.02)').replace('rgb', 'rgba') },
                ]),
            },
            data: trend.values,
        }],
    });
    window.addEventListener('resize', () => chart.resize());
}

// ── 表格 ──────────────────────────────────
function renderTable(accounts) {
    const tbody = document.getElementById('account-table-body');
    if (!accounts.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">暂无账户，请先添加</td></tr>';
        return;
    }
    tbody.innerHTML = accounts.map(a => `
        <tr style="cursor:pointer" onclick="location.href='/accounts/${a.account_id}'">
            <td><strong>${a.account_name}</strong></td>
            <td>${a.fund_count}</td>
            <td class="text-end">¥${a.total_market_value.toLocaleString()}</td>
            <td class="text-end">¥${a.total_cost.toLocaleString()}</td>
            <td class="text-end ${profitClass(a.total_profit)}">${formatMoney(a.total_profit)}</td>
            <td class="text-end ${profitClass(a.total_profit_pct)}">${formatPct(a.total_profit_pct)}</td>
        </tr>
    `).join('');
}

loadDashboard();
</script>
{% endblock %}
